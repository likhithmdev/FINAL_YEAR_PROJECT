android.useAndroidX=true

# Every dependency in this module is already AndroidX, so the Jetifier
# bytecode-rewriting pass only costs build time here.
android.enableJetifier=false

# Compiling this module's Compose sources needs more than the previous 2 GB
# default: the daemon was being killed mid-build and dumping heap snapshots
# into the project directory.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.caching=true

android.suppressUnsupportedCompileSdk=35
